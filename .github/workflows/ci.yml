name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mpris-tab-bridge-unsigned
          path: dist/*
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-glib-2.0 dbus
      - run: make test
      - run: cd host && cargo clippy --locked -- -D warnings
