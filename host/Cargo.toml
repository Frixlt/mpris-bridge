[package]
name = "mpris-bridge-host"
version = "1.1.4"
edition = "2021"
description = "Native-messaging helper that publishes browser media tabs as MPRIS players"
license = "MIT"
repository = "https://github.com/Frixlt/mpris-bridge"

[[bin]]
name = "mpris-bridge-host"
path = "src/main.rs"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "io-std", "io-util", "sync", "macros"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
